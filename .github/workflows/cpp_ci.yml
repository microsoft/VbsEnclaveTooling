name: cpp_ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'feature/**'
      - 'feat/**'

jobs:
  build-edl-code-gen:
    name: Build EdlCodeGen
    # Pinned to windows-2022 (Visual Studio 2022 / v143 toolset). The
    # windows-latest image migrated to Visual Studio 2026 (v18) in June 2026,
    # which does not reliably provide the v143 build tools these projects pin
    # (MSB8020) and whose LTCG backend intermittently crashed with LNK1257.
    runs-on: windows-2022

    strategy:
      matrix:
        platform: [x64, arm64]
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Setup NuGet
        uses: NuGet/setup-nuget@b26b823c478ee115be5c9403e62c90b0bf943843 # v3.1.0

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          # 2025.09.17 release.
          vcpkgGitCommitId: '4334d8b4c8916018600212ab4dd4bbdc343065d1'

      - name: Integrate vcpkg with MSBuild
        run: ${{ env.VCPKG_ROOT }}/vcpkg.exe integrate install
        shell: pwsh

      - name: Restore NuGet packages
        run: nuget restore VbsEnclaveTooling.sln -ConfigFile NuGet.config

      - name: Build EdlCodeGen solution
        run: msbuild VbsEnclaveTooling.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}

      # Building the ToolingExecutable regenerates src/ToolingSharedLibrary/CurrentCodeGenerationState.
      # If the checked-in baselines differ from what the freshly-built generator produces, either a
      # generator change was not regenerated, or the generated output changed unexpectedly. Fail so it
      # is caught in review rather than shipping silently. x64 only: the generator only runs on x64.
      - name: Verify generated code baselines are up to date
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          git add src/ToolingSharedLibrary/CurrentCodeGenerationState
          git diff --cached --exit-code -- src/ToolingSharedLibrary/CurrentCodeGenerationState
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Generated code baselines in src/ToolingSharedLibrary/CurrentCodeGenerationState are out of date. Rebuild the ToolingExecutable project and commit the regenerated files."
            exit 1
          }

      # Upload build outputs so the test job can use them.
      - name: Upload EdlCodeGen artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edlcodegen-${{ matrix.platform }}-${{ matrix.configuration }}
          path: |
            _build/${{ matrix.platform }}/${{ matrix.configuration }}/
  run-edl-code-gen-tests:
    name: Test EdlCodeGen
    # See note on the build-edl-code-gen job: pinned to VS2022 / v143.
    runs-on: windows-2022
    needs: build-edl-code-gen

    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Download x64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: edlcodegen-x64-${{ matrix.configuration }}
          path: _build/x64/${{ matrix.configuration }}/

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      # Unit tests are only in x64 since the EdlCodeGen executable is only in x64.
      - name: Run EdlCodeGen unit tests
        shell: pwsh
        run: |
          $vsTestInstallPath = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Workload.ManagedDesktop Microsoft.VisualStudio.Workload.Web -requiresAny -property installationPath
          $vstestConsoleExe = join-path $vsTestInstallPath 'Common7/IDE/CommonExtensions/Microsoft/TestWindow/vstest.console.exe'
          & $vstestConsoleExe "_build/x64/${{ matrix.configuration }}/UnitTests.dll"

  build-sdk:
    name: Build Veil SDK
    # See note on the build-edl-code-gen job: pinned to VS2022 / v143.
    runs-on: windows-2022

    strategy:
      matrix:
        platform: [x64, arm64]
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Setup NuGet
        uses: NuGet/setup-nuget@b26b823c478ee115be5c9403e62c90b0bf943843 # v3.1.0

      - name: Restore NuGet packages
        run: nuget restore src/VbsEnclaveSDK/vbs_enclave_implementation_library.sln -ConfigFile NuGet.config

      - name: Build SDK solution
        run: msbuild src/VbsEnclaveSDK/vbs_enclave_implementation_library.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}
