name: rust_ci

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - '.github/workflows/rust_ci.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust_ci.yml'

defaults:
  run:
    working-directory: ./rust

jobs:

  # Build once with the v143 toolset; Rust runners only need the x64 executable.
  build-edl-code-gen:
    name: Build Rust binding generator
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Setup NuGet
        uses: NuGet/setup-nuget@fd55a6f3b34392fa83fde1454582407d8c714123 # v4.0

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: '4334d8b4c8916018600212ab4dd4bbdc343065d1'

      - name: Integrate vcpkg with MSBuild
        run: ${{ env.VCPKG_ROOT }}/vcpkg.exe integrate install
        shell: pwsh
        working-directory: .

      - name: Restore NuGet packages
        run: nuget restore VbsEnclaveTooling.sln -ConfigFile NuGet.config
        working-directory: .

      - name: Build binding generator
        run: msbuild VbsEnclaveTooling.sln /m /p:Configuration=Release /p:Platform=x64
        working-directory: .

      - name: Upload binding generator
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-edlcodegen
          path: _build/x64/Release/edlcodegen.exe
          if-no-files-found: error

  # Confirm Rust code formatting is ok.
  fmt:
    runs-on: windows-latest
    needs: build-edl-code-gen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download binding generator
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-edlcodegen
          path: _build/x64/Release
      - run: rustup update stable
      
      - name: fmt edlcodegen
        run: cargo fmt --all -- --check
        working-directory: ./rust/edlcodegen

      - name: Generate edlcodegen bindings for the sdk
        shell: pwsh
        working-directory: ./rust/sdk
        run: |
          pwsh ./generate_codegen_for_workspace.ps1

      - name: fmt sdk
        run: cargo fmt --all -- --check
        working-directory: ./rust/sdk

  # Confirm Rust linter doesn't produce errors.
  clippy:
    runs-on: windows-latest
    needs: build-edl-code-gen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download binding generator
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-edlcodegen
          path: _build/x64/Release
      - run: rustup update stable

      - name: clippy edlcodegen
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: ./rust/edlcodegen

      - name: Generate edlcodegen bindings for the sdk
        shell: pwsh
        working-directory: ./rust/sdk
        run: |
          pwsh ./generate_codegen_for_workspace.ps1
          
      - name: clippy sdk
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: ./rust/sdk

 # Confirm all Rust tests pass without errors on x64 and arm64.
  test:
    needs: build-edl-code-gen
    strategy:
      matrix:
        include:
          - version: stable
            host: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            runner: windows-2025
          - version: stable
            host: aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download binding generator
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-edlcodegen
          path: _build/x64/Release
      - name: Update toolchain
        run: rustup update --no-self-update ${{ matrix.version }} && rustup default ${{ matrix.version }}-${{ matrix.host }}
      - name: Add toolchain target
        run: rustup target add ${{ matrix.target }}
      - name: Install fmt, clippy
        run: rustup component add clippy rustfmt

      - name: Generate edlcodegen bindings for the sdk
        shell: pwsh
        working-directory: ./rust/sdk
        run: |
          pwsh ./generate_codegen_for_workspace.ps1

      - name: test Edlcodegen
        working-directory: ./rust/edlcodegen
        run: cargo test --workspace

      - name: test SDK
        working-directory: ./rust/sdk
        run: cargo test 
          --workspace
          --exclude vbsenclave-sdk-enclave
          --exclude windows-enclave
          --exclude sdk_enclave_gen
